<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Forerunner 570 Watch Face Studio</title>
  <script src="https://www.gstatic.com/antigravity/web/dev/tailwindcss.min.js"></script>
</head>

<body class="bg-transparent text-[var(--foreground)] antialiased p-0 m-0">
  <div class="py-1 grid grid-cols-1 md:grid-cols-[296px_1fr] gap-4 items-center">
    <!-- Left: Interactive Clickable AMOLED Watch Canvas -->
    <div class="flex flex-col items-center justify-center">
      <canvas id="watchCanvas" width="288" height="288" class="block rounded-full cursor-pointer"
        title="Click any data zone to test touch-and-hold shortcut"></canvas>
      <div id="specLine" class="mt-1 text-xs font-mono text-[var(--muted-foreground)] text-center">
        47mm (454x454) • Click watch zones to test shortcuts
      </div>
    </div>

    <!-- Right: Live Controls & Interactive Touch Readout -->
    <div class="space-y-1.5 text-xs">
      <div class="pb-1 border-b border-[var(--card-border)] flex items-center justify-between gap-2">
        <span class="font-semibold text-sm text-[var(--foreground)]">FR570 Runner Pro v1.2 • Studio</span>
        <span id="modeBadge"
          class="px-2 py-0.5 rounded-full bg-[var(--card)] border border-[var(--card-border)] font-mono text-[var(--muted-foreground)]">Active
          Mode</span>
      </div>

      <!-- Editable Middle Banner / Calendar Mode -->
      <div class="grid grid-cols-3 gap-2">
        <div>
          <label class="block text-[var(--muted-foreground)] mb-0.5">Middle Banner</label>
          <select id="calendarMode"
            class="w-full px-1.5 py-1 rounded bg-[var(--card)] border border-[var(--card-border)] text-[var(--foreground)]">
            <option value="0">Daily Summary</option>
            <option value="1" selected>Cal (Fallback)</option>
            <option value="2">Always Cal</option>
            <option value="3">Custom Note</option>
          </select>
        </div>
        <div>
          <label class="block text-[var(--muted-foreground)] mb-0.5">Event Time</label>
          <input id="eventTimeInput" type="text" value="16:30" maxlength="10"
            class="w-full px-2 py-1 rounded bg-[var(--card)] border border-[var(--card-border)] text-[var(--foreground)] font-mono" />
        </div>
        <div>
          <label class="block text-[var(--muted-foreground)] mb-0.5">Event / Note</label>
          <input id="eventTitleInput" type="text" value="Aiden music" maxlength="48"
            class="w-full px-2 py-1 rounded bg-[var(--card)] border border-[var(--card-border)] text-[var(--foreground)]" />
        </div>
      </div>

      <!-- Card Style + Weather Detail + Battery Format -->
      <div class="grid grid-cols-3 gap-2">
        <div>
          <label class="block text-[var(--muted-foreground)] mb-0.5">Layout Style</label>
          <select id="cardStyle"
            class="w-full px-1.5 py-1 rounded bg-[var(--card)] border border-[var(--card-border)] text-[var(--foreground)]">
            <option value="2">#1 Top Clock + Wide Box + Smooth Bezel</option>
            <option value="3">#2 Pure Black Minimal (No Boxes)</option>
            <option value="4">#3 Split Screen: Big Stacked Clock Left</option>
            <option value="5">#4 Top Event Banner + Slanted Boxes</option>
            <option value="6">#5 Red &amp; Blue Split: Red Top / Blue Bottom</option>
            <option value="7">#6 Red &amp; Blue Outer Ring + Black Center</option>
          </select>
        </div>
        <div>
          <label class="block text-[var(--muted-foreground)] mb-0.5">Weather Bar</label>
          <select id="weatherDetail"
            class="w-full px-1.5 py-1 rounded bg-[var(--card)] border border-[var(--card-border)] text-[var(--foreground)]">
            <option value="0">Full 2-Line</option>
            <option value="1">Clean 2-Line</option>
            <option value="2">Compact 1-Line</option>
          </select>
        </div>
        <div>
          <label class="block text-[var(--muted-foreground)] mb-0.5">Battery Format</label>
          <select id="batteryFormat"
            class="w-full px-1.5 py-1 rounded bg-[var(--card)] border border-[var(--card-border)] text-[var(--foreground)]">
            <option value="0">99% • 6d</option>
            <option value="1">6d Only</option>
            <option value="2">99% Only</option>
          </select>
        </div>
      </div>

      <!-- Bottom-Left + Bottom-Right Metrics -->
      <div class="grid grid-cols-2 gap-2">
        <div>
          <label class="block text-[var(--muted-foreground)] mb-0.5">Bottom-Left Pod</label>
          <select id="blMetric"
            class="w-full px-2 py-1 rounded bg-[var(--card)] border border-[var(--card-border)] text-[var(--foreground)]">
            <option value="0">Intensity (65/150)</option>
            <option value="1">Calories (1,840)</option>
            <option value="2">Distance (5.4km)</option>
          </select>
        </div>
        <div>
          <label class="block text-[var(--muted-foreground)] mb-0.5">Bottom-Right Pod</label>
          <select id="brMetric"
            class="w-full px-2 py-1 rounded bg-[var(--card)] border border-[var(--card-border)] text-[var(--foreground)]">
            <option value="0">Body Battery (78%)</option>
            <option value="1">Stress (34)</option>
            <option value="2">Calories (1,840)</option>
            <option value="3">Floors (8)</option>
          </select>
        </div>
      </div>

      <!-- Step Target Mode + Readiness Mode -->
      <div class="grid grid-cols-2 gap-2">
        <div>
          <label class="block text-[var(--muted-foreground)] mb-0.5">7-Day Step Target Mode</label>
          <select id="stepTargetMode"
            class="w-full px-2 py-1 rounded bg-[var(--card)] border border-[var(--card-border)] text-[var(--foreground)]">
            <option value="0">7-Day Running Avg (100%)</option>
            <option value="1">Beat 7-Day Avg (+5%)</option>
            <option value="2">Beat 7-Day Avg (+10%)</option>
            <option value="3">Garmin Fixed (10,000)</option>
          </select>
        </div>
        <div>
          <label class="block text-[var(--muted-foreground)] mb-0.5">Top-Left Training Pod</label>
          <select id="readinessMode"
            class="w-full px-2 py-1 rounded bg-[var(--card)] border border-[var(--card-border)] text-[var(--foreground)]">
            <option value="0">Readiness Estimate (73)</option>
            <option value="1">Training Status (PROD)</option>
          </select>
        </div>
      </div>

      <!-- Today's Steps Slider + World Clock -->
      <div class="grid grid-cols-2 gap-2">
        <div>
          <div class="flex items-center justify-between text-[var(--muted-foreground)] mb-0.5">
            <span>Today's Steps</span>
            <span id="stepsReadout" class="font-mono text-[var(--foreground)]">5,467</span>
          </div>
          <input id="stepsSlider" type="range" min="0" max="15000" step="100" value="5467"
            class="w-full mt-1.5 accent-[var(--primary)]" />
        </div>
        <div>
          <label class="block text-[var(--muted-foreground)] mb-0.5">World Clock City</label>
          <select id="worldCity"
            class="w-full px-2 py-1 rounded bg-[var(--card)] border border-[var(--card-border)] text-[var(--foreground)]">
            <option value="0">Kathmandu (KTM • UTC+5:45)</option>
            <option value="1">New Delhi (DEL • UTC+5:30)</option>
            <option value="2">London / UTC (LON • UTC+0)</option>
            <option value="3">New York (NYC • UTC-5)</option>
            <option value="4">Chicago (CHI • UTC-6)</option>
            <option value="5">Denver (DEN • UTC-7)</option>
            <option value="6">Los Angeles (LAX • UTC-8)</option>
            <option value="7">Paris / Berlin (CET • UTC+1)</option>
            <option value="8">Dubai (DXB • UTC+4)</option>
            <option value="9">Bangkok (BKK • UTC+7)</option>
            <option value="10">Singapore (SIN • UTC+8)</option>
            <option value="11">Tokyo (TYO • UTC+9)</option>
            <option value="12">Sydney (SYD • UTC+10)</option>
            <option value="13">Auckland (AKL • UTC+12)</option>
          </select>
        </div>
      </div>

      <!-- Toggle Checkboxes -->
      <div class="flex flex-wrap items-center gap-x-3 gap-y-1 text-[var(--foreground)]">
        <label class="flex items-center gap-1 cursor-pointer select-none">
          <input id="ticksToggle" type="checkbox" checked class="accent-[var(--primary)]" />
          <span>Chrono Ticks</span>
        </label>
        <label class="flex items-center gap-1 cursor-pointer select-none">
          <input id="arcsToggle" type="checkbox" checked class="accent-[var(--primary)]" />
          <span>Progress Arcs</span>
        </label>
        <label class="flex items-center gap-1 cursor-pointer select-none">
          <input id="sparkToggle" type="checkbox" checked class="accent-[var(--primary)]" />
          <span>7D Sparkline</span>
        </label>
        <label class="flex items-center gap-1 cursor-pointer select-none">
          <input id="gaugesToggle" type="checkbox" checked class="accent-[var(--primary)]" />
          <span>Micro-Gauges</span>
        </label>
      </div>

      <!-- Theme Swatches + Size + AOD -->
      <div class="flex flex-wrap items-center justify-between gap-2 pt-0.5">
        <div class="flex items-center gap-1.5 flex-wrap">
          <span class="text-[var(--muted-foreground)] mr-0.5">Theme:</span>
          <button type="button" data-theme="0" class="swatch w-4 h-4 rounded-full border-2 border-[var(--foreground)]"
            style="background:#EF4444" title="0: Black + Red &amp; Orange"></button>
          <button type="button" data-theme="1" class="swatch w-4 h-4 rounded-full border border-[var(--card-border)]"
            style="background:#F59E0B" title="1: Black + Gold &amp; Green"></button>
          <button type="button" data-theme="2" class="swatch w-4 h-4 rounded-full border border-[var(--card-border)]"
            style="background:#CBD5E1" title="2: Stealth Titanium &amp; Crimson"></button>
          <button type="button" data-theme="3" class="swatch w-4 h-4 rounded-full border border-[var(--card-border)]"
            style="background:#10B981" title="3: Racing Emerald &amp; Carbon"></button>
          <button type="button" data-theme="4" class="swatch w-4 h-4 rounded-full border border-[var(--card-border)]"
            style="background:#0D9488" title="4: Petrol Teal &amp; Aqua"></button>
          <button type="button" data-theme="5" class="swatch w-4 h-4 rounded-full border border-[var(--card-border)]"
            style="background:#4A77A8" title="5: Matte Aviation Steel"></button>
          <button type="button" data-theme="6" class="swatch w-4 h-4 rounded-full border border-[var(--card-border)]"
            style="background:linear-gradient(135deg,#DC2626 50%,#1E3A5F 50%)"
            title="6: Midnight Ceramic Navy"></button>
          <button type="button" data-theme="7" class="swatch w-4 h-4 rounded-full border border-[var(--card-border)]"
            style="background:conic-gradient(#EF4444,#F59E0B,#10B981,#0D9488,#4A77A8,#DC2626)"
            title="7: Custom Color Wheel"></button>
          <input id="customPrimPicker" type="color" value="#EF4444" title="Wheel Primary Color"
            class="w-4 h-4 p-0 border-0 rounded cursor-pointer bg-transparent" />
          <input id="customSecPicker" type="color" value="#475569" title="Wheel Secondary / Ring Color"
            class="w-4 h-4 p-0 border-0 rounded cursor-pointer bg-transparent" />
        </div>

        <select id="watchSize"
          class="px-1.5 py-0.5 rounded bg-[var(--card)] border border-[var(--card-border)] text-[var(--foreground)]">
          <option value="47">47mm</option>
          <option value="42">42mm</option>
        </select>

        <select id="fontWeight"
          class="px-1.5 py-0.5 rounded bg-[var(--card)] border border-[var(--card-border)] text-[var(--foreground)]"
          title="Font Style (Normal vs Bold)">
          <option value="0">Normal / Crisp Font</option>
          <option value="1">All Bold Font</option>
          <option value="2">Mixed (Bold # / Normal Labels)</option>
        </select>

        <label class="flex items-center gap-1 cursor-pointer select-none text-[var(--foreground)]">
          <input id="actualSizeToggle" type="checkbox" class="accent-[var(--primary)]" />
          <span>1:1 Watch Size (1.4")</span>
        </label>

        <label class="flex items-center gap-1 cursor-pointer select-none text-[var(--foreground)]">
          <input id="aodToggle" type="checkbox" class="accent-[var(--primary)]" />
          <span>AOD Sleep</span>
        </label>
      </div>

      <!-- Interactive Touch Shortcut Feedback -->
      <div id="shortcutReadout"
        class="px-2.5 py-1.5 rounded bg-[var(--card)] border border-[var(--card-border)] font-mono text-[var(--muted-foreground)]">
        <span class="text-[var(--foreground)] font-semibold">Touch Shortcut:</span> Click any zone on the watch to test
        WatchFaceDelegate.onPress()
      </div>
    </div>
  </div>

  <script>
    (function () {
      var canvas = document.getElementById("watchCanvas");
      var ctx = canvas.getContext("2d");
      var eventTimeEl = document.getElementById("eventTimeInput");
      var eventTitleEl = document.getElementById("eventTitleInput");
      var calendarModeEl = document.getElementById("calendarMode");
      var cardStyleEl = document.getElementById("cardStyle");
      var weatherDetailEl = document.getElementById("weatherDetail");
      var batteryFormatEl = document.getElementById("batteryFormat");
      var blMetricEl = document.getElementById("blMetric");
      var brMetricEl = document.getElementById("brMetric");
      var stepTargetModeEl = document.getElementById("stepTargetMode");
      var readinessModeEl = document.getElementById("readinessMode");
      var stepsSliderEl = document.getElementById("stepsSlider");
      var stepsReadoutEl = document.getElementById("stepsReadout");
      var worldCityEl = document.getElementById("worldCity");
      var watchSizeEl = document.getElementById("watchSize");
      var fontWeightEl = document.getElementById("fontWeight");
      var _rawFontDesc = Object.getOwnPropertyDescriptor(CanvasRenderingContext2D.prototype, "font");
      if (_rawFontDesc && _rawFontDesc.set) {
        Object.defineProperty(ctx, "font", {
          get: function () { return _rawFontDesc.get.call(this); },
          set: function (v) {
            var fw = fontWeightEl ? parseInt(fontWeightEl.value, 10) : 0;
            if (typeof v === "string" && v.indexOf("700 ") === 0) {
              if (fw === 0 || (fw === 2 && parseFloat(v.slice(4)) < 14)) {
                v = "400 " + v.slice(4);
              }
            }
            _rawFontDesc.set.call(this, v);
          }
        });
      }
      var ticksToggleEl = document.getElementById("ticksToggle");
      var arcsToggleEl = document.getElementById("arcsToggle");
      var sparkToggleEl = document.getElementById("sparkToggle");
      var gaugesToggleEl = document.getElementById("gaugesToggle");
      var actualSizeToggleEl = document.getElementById("actualSizeToggle");
      var aodToggleEl = document.getElementById("aodToggle");
      var customPrimEl = document.getElementById("customPrimPicker");
      var customSecEl = document.getElementById("customSecPicker");
      var specLineEl = document.getElementById("specLine");
      var modeBadgeEl = document.getElementById("modeBadge");
      var shortcutReadoutEl = document.getElementById("shortcutReadout");
      var swatches = document.querySelectorAll(".swatch");

      var THEMES = [
        {
          bg: "#09090B", cardBg: "#17171A", cardBd: "#2C2C30", specular: "#3F3F46", badgeBg: "#27272A",
          primary: "#EF4444", secondary: "#F97316", bodyBat: "#E4E4E7", crimson: "#EF4444", rec: "#F97316",
          text: "#FFFFFF", muted: "#E4E4E7", dim: "#D4D4D8", tickMajor: "#71717A", tickMinor: "#27272A",
          track: "#202024", cloud: "#E4E4E7", tipDot: "#FFFFFF", pillText: "#F4F4F5", onPrimary: "#FFFFFF",
          ttTop: "#EF4444", ttBotRing: "#475569", ttBotDial: "#1E242C", ttCard: "#12161C", ttBd: "#64748B", ttTrack: "#262E38", ttSec: "#FACC15"
        },
        {
          bg: "#080807", cardBg: "#161514", cardBd: "#2A2826", specular: "#3F3B36", badgeBg: "#262320",
          primary: "#F59E0B", secondary: "#F97316", bodyBat: "#10B981", crimson: "#EF4444", rec: "#D97706",
          text: "#FAF8F5", muted: "#D6D3D1", dim: "#A8A29E", tickMajor: "#57534E", tickMinor: "#292524",
          track: "#24211E", cloud: "#E7E5E4", tipDot: "#FFFFFF", pillText: "#FDE047", onPrimary: "#0F0F0F",
          ttTop: "#F59E0B", ttBotRing: "#166534", ttBotDial: "#0D3B20", ttCard: "#0A2616", ttBd: "#22C55E", ttTrack: "#183828", ttSec: "#F97316"
        },
        {
          bg: "#09090B", cardBg: "#16161A", cardBd: "#3F3F46", specular: "#71717A", badgeBg: "#27272A",
          primary: "#CBD5E1", secondary: "#EF4444", bodyBat: "#E4E4E7", crimson: "#EF4444", rec: "#EF4444",
          text: "#FFFFFF", muted: "#E4E4E7", dim: "#A1A1AA", tickMajor: "#71717A", tickMinor: "#3F3F46",
          track: "#242428", cloud: "#E4E4E7", tipDot: "#FFFFFF", pillText: "#F4F4F5", onPrimary: "#0F0F12",
          ttTop: "#EF4444", ttBotRing: "#475569", ttBotDial: "#1E242C", ttCard: "#12161C", ttBd: "#64748B", ttTrack: "#262E38", ttSec: "#FACC15"
        },
        {
          bg: "#09090B", cardBg: "#101816", cardBd: "#20483A", specular: "#10B981", badgeBg: "#142A23",
          primary: "#10B981", secondary: "#6EE7B7", bodyBat: "#E4E4E7", crimson: "#EF4444", rec: "#6EE7B7",
          text: "#FFFFFF", muted: "#E4E4E7", dim: "#A7F3D0", tickMajor: "#64748B", tickMinor: "#20483A",
          track: "#182A24", cloud: "#E4E4E7", tipDot: "#FFFFFF", pillText: "#A7F3D0", onPrimary: "#0F0F12",
          ttTop: "#10B981", ttBotRing: "#334155", ttBotDial: "#161C24", ttCard: "#0E1418", ttBd: "#475569", ttTrack: "#1E293B", ttSec: "#FACC15"
        },
        {
          bg: "#09090B", cardBg: "#0E181A", cardBd: "#1E4A4E", specular: "#0D9488", badgeBg: "#122A2D",
          primary: "#0D9488", secondary: "#5EEAD4", bodyBat: "#E4E4E7", crimson: "#EF4444", rec: "#5EEAD4",
          text: "#FFFFFF", muted: "#E4E4E7", dim: "#99F6E4", tickMajor: "#64748B", tickMinor: "#1E4A4E",
          track: "#162E30", cloud: "#E4E4E7", tipDot: "#FFFFFF", pillText: "#99F6E4", onPrimary: "#FFFFFF",
          ttTop: "#EF4444", ttBotRing: "#0F766E", ttBotDial: "#0E3436", ttCard: "#0A2224", ttBd: "#14948A", ttTrack: "#134244", ttSec: "#FACC15"
        },
        {
          bg: "#09090B", cardBg: "#11161E", cardBd: "#2C425E", specular: "#4A77A8", badgeBg: "#172230",
          primary: "#4A77A8", secondary: "#93C5FD", bodyBat: "#E4E4E7", crimson: "#EF4444", rec: "#93C5FD",
          text: "#FFFFFF", muted: "#E2E8F0", dim: "#94A3B8", tickMajor: "#64748B", tickMinor: "#2C425E",
          track: "#1C2838", cloud: "#E2E8F0", tipDot: "#FFFFFF", pillText: "#BFDBFE", onPrimary: "#FFFFFF",
          ttTop: "#EF4444", ttBotRing: "#2E5278", ttBotDial: "#142A44", ttCard: "#0E1C2E", ttBd: "#4A77A8", ttTrack: "#1E3552", ttSec: "#FACC15"
        },
        {
          bg: "#0A1628", cardBg: "#12243E", cardBd: "#305682", specular: "#4A77A8", badgeBg: "#162C4A",
          primary: "#DC2626", secondary: "#FACC15", bodyBat: "#FFFFFF", crimson: "#DC2626", rec: "#FACC15",
          text: "#FFFFFF", muted: "#E2E8F0", dim: "#B4C2D2", tickMajor: "#B4C2D2", tickMinor: "#305682",
          track: "#1A3454", cloud: "#E2E8F0", tipDot: "#FFFFFF", pillText: "#FFFFFF", onPrimary: "#FFFFFF",
          ttTop: "#DC2626", ttBotRing: "#1E3A5F", ttBotDial: "#0E1E36", ttCard: "#0A1628", ttBd: "#345C8C", ttTrack: "#182C48", ttSec: "#FACC15"
        }
      ];

      function resolveStudioTheme() {
        if (currentThemeIdx === 7) {
          var p = customPrimEl ? customPrimEl.value : "#EF4444";
          var s = customSecEl ? customSecEl.value : "#475569";
          return {
            bg: "#09090B", cardBg: "#14161B", cardBd: "#333A46", specular: p, badgeBg: "#1E222B",
            primary: p, secondary: s, bodyBat: "#E4E4E7", crimson: "#EF4444", rec: s,
            text: "#FFFFFF", muted: "#E4E4E7", dim: "#D4D4D8", tickMajor: "#71717A", tickMinor: "#2D323C",
            track: "#1F232B", cloud: "#E4E4E7", tipDot: "#FFFFFF", pillText: "#FFFFFF", onPrimary: "#FFFFFF",
            ttTop: p, ttBotRing: s, ttBotDial: "#161B22", ttCard: "#10141A", ttBd: s, ttTrack: "#222933", ttSec: "#FACC15"
          };
        }
        return THEMES[currentThemeIdx] || THEMES[0];
      }

      var SAMPLE_7D_HISTORY = [7600, 8900, 8100, 9600, 7400, 8500, 7740];
      var WORLD_CITIES = [
        { code: "KTM", offsetMins: 345 },
        { code: "DEL", offsetMins: 330 },
        { code: "LON", offsetMins: 0 },
        { code: "NYC", offsetMins: -300 },
        { code: "CHI", offsetMins: -360 },
        { code: "DEN", offsetMins: -420 },
        { code: "LAX", offsetMins: -480 },
        { code: "CET", offsetMins: 60 },
        { code: "DXB", offsetMins: 240 },
        { code: "BKK", offsetMins: 420 },
        { code: "SIN", offsetMins: 480 },
        { code: "TYO", offsetMins: 540 },
        { code: "SYD", offsetMins: 600 },
        { code: "AKL", offsetMins: 720 }
      ];

      var currentThemeIdx = 0;
      var logicalSize = 288;
      var activeHighlight = null;
      var highlightTimer = null;

      function setupDpi() {
        var dpr = window.devicePixelRatio || 1;
        canvas.width = logicalSize * dpr;
        canvas.height = logicalSize * dpr;
        canvas.style.width = logicalSize + "px";
        canvas.style.height = logicalSize + "px";
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      }

      function pad2(n) {
        return n < 10 ? "0" + n : "" + n;
      }

      function formatComma(n) {
        return n.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ",");
      }

      function computeStepTarget(mode) {
        var sum = 0;
        for (var i = 0; i < SAMPLE_7D_HISTORY.length; i++) {
          sum += SAMPLE_7D_HISTORY[i];
        }
        var avg7d = Math.floor(sum / SAMPLE_7D_HISTORY.length);
        if (mode === 1) return Math.floor((avg7d * 105) / 100);
        if (mode === 2) return Math.floor((avg7d * 110) / 100);
        if (mode === 3) return 10000;
        return avg7d;
      }

      function fitText(text, maxWidth) {
        if (ctx.measureText(text).width <= maxWidth) return text;
        var trimmed = text;
        while (trimmed.length > 1 && ctx.measureText(trimmed + "...").width > maxWidth) {
          trimmed = trimmed.slice(0, -1);
        }
        return trimmed + "...";
      }

      function getWorldCityParts(now, cityIndex) {
        var city = WORLD_CITIES[cityIndex] || WORLD_CITIES[0];
        var utcMs = now.getTime() + (now.getTimezoneOffset() * 60000);
        var cityDate = new Date(utcMs + (city.offsetMins * 60000));
        var hh = pad2(cityDate.getHours());
        var mm = pad2(cityDate.getMinutes());
        var localKey = (now.getFullYear() * 10000) + ((now.getMonth() + 1) * 100) + now.getDate();

          ctx.lineTo(leftX + 90, row1Y + row1H - 7);
          ctx.stroke();

          ctx.textAlign = "center";
          ctx.font = "700 9.5px system-ui, sans-serif";
          ctx.fillStyle = t.muted;
          ctx.fillText(readyLbl, leftX + 26, row1Y + 11.5);
          ctx.fillText("REC", leftX + 69, row1Y + 11.5);
          ctx.font = "700 20px system-ui, sans-serif";
          ctx.fillStyle = t.primary;
          ctx.fillText(readyVal, leftX + 26, row1Y + 30);
          ctx.fillStyle = t.rec;
          ctx.fillText("0h", leftX + 69, row1Y + 30);

          var sxP = leftX + 97;
          var swP = gridW - 105;
          ctx.textAlign = "left";
          ctx.font = "700 9.5px system-ui, sans-serif";
          ctx.fillStyle = t.muted;
          ctx.fillText("STEPS", sxP, row1Y + 11.5);
          ctx.textAlign = "right";
          ctx.fillStyle = t.dim;
          ctx.fillText(formatComma(stepTarget), sxP + swP, row1Y + 11.5);
          ctx.textAlign = "left";
          ctx.font = "700 20px system-ui, sans-serif";
          ctx.fillStyle = t.text;
          ctx.fillText(formatComma(stepsToday), sxP, row1Y + 30);
          if (showSpark) {
            var spBaseP = row1Y + row1H - 8;
            var spXP = sxP + swP - 31;
            var maxHP = stepTarget;
            for (var mp = 0; mp < SAMPLE_7D_HISTORY.length; mp++) if (SAMPLE_7D_HISTORY[mp] > maxHP) maxHP = SAMPLE_7D_HISTORY[mp];
            for (var bp = 0; bp < 7; bp++) {
              var bhp = Math.max(2, Math.round((SAMPLE_7D_HISTORY[bp] / maxHP) * 16));
              ctx.fillStyle = SAMPLE_7D_HISTORY[bp] >= stepTarget ? t.primary : t.dim;
              ctx.fillRect(spXP + bp * 4.2, spBaseP - bhp, 3, bhp);
            }
          }
        } else {
          // Option 3 HUD Row 1
          ctx.textAlign = "center";
          ctx.font = "700 9.5px system-ui, sans-serif";
          ctx.fillStyle = t.muted;
          ctx.fillText(readyLbl, leftX + 23, row1Y + 10.5);
          ctx.fillText("REC", leftX + 67, row1Y + 10.5);
          ctx.font = "700 20px system-ui, sans-serif";
          ctx.fillStyle = t.primary;
          ctx.fillText(readyVal, leftX + 23, row1Y + 28);
          ctx.fillStyle = t.rec;
          ctx.fillText("0h", leftX + 67, row1Y + 28);
          if (showGauges) drawHBar(leftX + 8, row1Y + row1H - 7, 74, 2.5, 0.82, t.primary, t.track);
          ctx.strokeStyle = t.cardBd;
          ctx.lineWidth = 0.7;
          ctx.beginPath();
          ctx.moveTo(leftX + 90, row1Y + 5);
          ctx.lineTo(leftX + 90, row1Y + row1H - 5);
          ctx.stroke();

          var sx3 = leftX + 98;
          var sw3 = gridW - 102;
          ctx.textAlign = "left";
          ctx.font = "700 9.5px system-ui, sans-serif";
          ctx.fillStyle = t.muted;
          ctx.fillText("STEPS", sx3, row1Y + 10.5);
          ctx.textAlign = "right";
          ctx.fillStyle = t.dim;
          ctx.fillText(formatComma(stepTarget), sx3 + sw3, row1Y + 10.5);
          ctx.textAlign = "left";
          ctx.font = "700 20px system-ui, sans-serif";
          ctx.fillStyle = t.text;
          ctx.fillText(formatComma(stepsToday), sx3, row1Y + 28);
          if (showGauges) drawHBar(sx3, row1Y + row1H - 7, sw3, 2.5, stepRatio, t.primary, t.track);
        }

        // Row 2 Metrics
        var blLbl = blMode === 1 ? "KCAL" : (blMode === 2 ? "DIST" : "INTENS");
        var blVal = blMode === 1 ? "1,840" : (blMode === 2 ? "5.4km" : "65m");
        var blRat = blMode === 1 ? 0.74 : (blMode === 2 ? 0.68 : intRatio);
        var brLbl = brMode === 1 ? "STRESS" : (brMode === 2 ? "KCAL" : (brMode === 3 ? "FLOORS" : "BODY"));
        var brVal = brMode === 1 ? "34" : (brMode === 2 ? "1,840" : (brMode === 3 ? "8" : "82%"));
        var brRat = brMode === 1 ? 0.34 : (brMode === 2 ? 0.74 : (brMode === 3 ? 0.80 : 0.82));

        if (cStyle === 3) {
          var row2Y = row1Y + row1H + 7;
          var colsX = [leftX + 36, cx, leftX + gridW - 36];
          ctx.textAlign = "center";
          ctx.font = "400 7.8px system-ui, sans-serif";
          ctx.fillStyle = t.muted;
          ctx.fillText(blLbl, colsX[0], row2Y + 7);
          ctx.fillText("HEART", colsX[1], row2Y + 7);
          ctx.fillText(brLbl, colsX[2], row2Y + 7);

          ctx.font = "700 12.5px system-ui, sans-serif";
          ctx.fillStyle = t.secondary;
          ctx.fillText(blVal, colsX[0], row2Y + 23);
          ctx.font = "700 15px system-ui, sans-serif";
          ctx.fillStyle = t.text;
          ctx.fillText("69", colsX[1] + 5, row2Y + 23);
          ctx.fillStyle = t.bodyBat;
          ctx.fillText(brVal, colsX[2], row2Y + 23);
          if (showGauges) {
            drawArcSeg(colsX[0], row2Y + 20, 23, 40, 140, false, t.track, 2.5);
            drawArcSeg(colsX[0], row2Y + 20, 23, 140 - 100 * blRat, 140, false, t.secondary, 2.5);
            drawArcSeg(colsX[1], row2Y + 20, 23, 40, 140, false, t.track, 2.5);
            drawArcSeg(colsX[1], row2Y + 20, 23, 140 - 45, 140, false, t.crimson, 2.5);
            drawArcSeg(colsX[2], row2Y + 20, 23, 40, 140, false, t.track, 2.5);
            drawArcSeg(colsX[2], row2Y + 20, 23, 140 - 100 * brRat, 140, false, t.bodyBat, 2.5);
          }
        } else {
          var r2Cy = row1Y + row1H + 31;
          var r2R = 24.5;
          var rOff = W * 0.229;
          var isTick = cStyle === 1;
          drawRingGauge(cx - rOff, r2Cy, r2R, blRat, t.secondary, t.secondary, blLbl, blVal, false, isTick, showGauges, t);
          drawRingGauge(cx, r2Cy, r2R, 0.45, t.crimson, t.text, "HEART", "69", true, isTick, showGauges, t);
          drawRingGauge(cx + rOff, r2Cy, r2R, brRat, t.bodyBat, t.bodyBat, brLbl, brVal, false, isTick, showGauges, t);
        }

        // Bottom 6 O'Clock Segmented Battery Pill
        var battY = W * 0.875;
        var bText = bFmt === 1 ? "6d" : (bFmt === 2 ? "99%" : "99% • 6d");
        var startBattX = cx - (bFmt === 0 ? 37 : 23);
        ctx.strokeStyle = t.muted;
        ctx.lineWidth = 1;
        ctx.strokeRect(startBattX, battY - 4.5, 18, 9);
        ctx.fillStyle = t.muted;
        ctx.fillRect(startBattX + 18, battY - 2, 1.5, 4);
        for (var blk = 0; blk < 4; blk++) {
          ctx.fillStyle = t.primary;
          ctx.fillRect(startBattX + 2 + blk * 3.6, battY - 2.8, 2.6, 5.6);
        }
        ctx.textAlign = "left";
        ctx.font = "700 10.5px system-ui, sans-serif";
        ctx.fillStyle = t.muted;
        ctx.fillText(bText, startBattX + 23, battY + 0.5);

        if (activeHighlight) {
          ctx.strokeStyle = t.text;
          ctx.lineWidth = 1.5;
          ctx.beginPath();
          ctx.roundRect(activeHighlight.x, activeHighlight.y, activeHighlight.w, activeHighlight.h, 6);
          ctx.stroke();
        }
      }

      canvas.addEventListener("click", function (evt) {
        if (aodToggleEl.checked) return;
        var rect = canvas.getBoundingClientRect();
        var scaleClick = logicalSize / rect.width;
        var x = (evt.clientX - rect.left) * scaleClick;
        var y = (evt.clientY - rect.top) * scaleClick;
        var W = logicalSize;
        var cx = W / 2;
        var blMode = parseInt(blMetricEl.value, 10);
        var brMode = parseInt(brMetricEl.value, 10);

        var zoneLabel = "Calendar Event";
        var compName = "COMPLICATION_TYPE_CALENDAR_EVENTS";
        var box = { x: cx - W * 0.38, y: W * 0.332, w: W * 0.76, h: 28 };
        var cStyle = parseInt(cardStyleEl.value, 10);

        if (cStyle >= 4) {
          if (y < W * 0.13) {
            zoneLabel = "Weather & Forecast";
            compName = "COMPLICATION_TYPE_CURRENT_WEATHER";
            box = { x: cx - 78, y: W * 0.03, w: 156, h: 26 };
          } else if (y >= W * 0.84) {
            zoneLabel = "Battery Status";
            compName = "COMPLICATION_TYPE_BATTERY";
            box = { x: cx - 40, y: W * 0.85, w: 80, h: 18 };
          } else if ((cStyle === 6 || cStyle === 7) && y >= W * 0.38 && y < W * 0.51) {
            zoneLabel = "Next Event Card";
            compName = "COMPLICATION_TYPE_CALENDAR_EVENTS";
            box = { x: W * 0.09, y: W * 0.40, w: W * 0.82, h: 25 };
          } else if (cStyle === 5 && y >= W * 0.09 && y < W * 0.20) {
            zoneLabel = "Next Event Card";
            compName = "COMPLICATION_TYPE_CALENDAR_EVENTS";
            box = { x: W * 0.175, y: W * 0.09, w: W * 0.65, h: 24 };
          } else if (cStyle === 4 && y >= W * 0.55 && y < W * 0.67) {
            zoneLabel = "Next Event Card";
            compName = "COMPLICATION_TYPE_CALENDAR_EVENTS";
            box = { x: W * 0.105, y: W * 0.56, w: W * 0.79, h: 25 };
          } else if (y >= W * 0.63 && y < W * 0.84) {
            if (x < W * 0.39) {
              zoneLabel = blMode === 1 ? "Calories" : (blMode === 2 ? "Distance" : "Intensity Minutes");
              compName = blMode === 1 ? "COMPLICATION_TYPE_CALORIES" : "COMPLICATION_TYPE_INTENSITY_MINUTES";
              box = { x: cx - W * 0.36, y: W * 0.66, w: W * 0.24, h: 42 };
            } else if (x <= W * 0.61) {
              zoneLabel = "Heart Rate";
              compName = "COMPLICATION_TYPE_HEART_RATE";
              box = { x: cx - W * 0.12, y: W * 0.66, w: W * 0.24, h: 42 };
            } else {
              zoneLabel = brMode === 1 ? "Stress" : (brMode === 2 ? "Calories" : (brMode === 3 ? "Floors" : "Body Battery"));
              compName = brMode === 1 ? "COMPLICATION_TYPE_STRESS" : (brMode === 2 ? "COMPLICATION_TYPE_CALORIES" : (brMode === 3 ? "COMPLICATION_TYPE_FLOORS_CLIMBED" : "COMPLICATION_TYPE_BODY_BATTERY"));
              box = { x: cx + W * 0.12, y: W * 0.66, w: W * 0.24, h: 42 };
            }
          } else {
            return;
          }
        } else if (y < W * 0.14) {
          zoneLabel = "Weather & Forecast";
          compName = "COMPLICATION_TYPE_CURRENT_WEATHER";
          box = { x: cx - 78, y: W * 0.04, w: 156, h: 28 };
        } else if (y >= W * 0.33 && y < W * 0.45) {
          zoneLabel = "Next Event Card";
          compName = "COMPLICATION_TYPE_CALENDAR_EVENTS";
          box = { x: cx - W * 0.38, y: W * 0.332, w: W * 0.76, h: 28 };
        } else if (y >= W * 0.45 && y < W * 0.65) {
          if (x < W * 0.32) {
            zoneLabel = "Training Readiness";
            compName = "COMPLICATION_TYPE_TRAINING_STATUS";
            box = { x: cx - W * 0.38, y: W * 0.445, w: W * 0.325, h: 48 };
          } else if (x < W * 0.45) {
            zoneLabel = "Recovery Time";
            compName = "COMPLICATION_TYPE_RECOVERY_TIME";
            box = { x: cx - W * 0.38, y: W * 0.445, w: W * 0.325, h: 48 };
          } else {
            zoneLabel = "Steps & 7D Target";
            compName = "COMPLICATION_TYPE_STEPS";
            box = { x: cx - W * 0.04, y: W * 0.445, w: W * 0.42, h: 48 };
          }
        } else if (y >= W * 0.65 && y < W * 0.84) {
          if (x < W * 0.39) {
            zoneLabel = blMode === 1 ? "Calories" : (blMode === 2 ? "Distance" : "Intensity Minutes");
            compName = blMode === 1 ? "COMPLICATION_TYPE_CALORIES" : "COMPLICATION_TYPE_INTENSITY_MINUTES";
            box = { x: cx - W * 0.38, y: W * 0.63, w: W * 0.24, h: 42 };
          } else if (x <= W * 0.61) {
            zoneLabel = "Heart Rate";
            compName = "COMPLICATION_TYPE_HEART_RATE";
            box = { x: cx - W * 0.12, y: W * 0.63, w: W * 0.24, h: 42 };
          } else {
            zoneLabel = brMode === 1 ? "Stress" : (brMode === 2 ? "Calories" : (brMode === 3 ? "Floors" : "Body Battery"));
            compName = brMode === 1 ? "COMPLICATION_TYPE_STRESS" : (brMode === 2 ? "COMPLICATION_TYPE_CALORIES" : (brMode === 3 ? "COMPLICATION_TYPE_FLOORS_CLIMBED" : "COMPLICATION_TYPE_BODY_BATTERY"));
            box = { x: cx + W * 0.14, y: W * 0.63, w: W * 0.24, h: 42 };
          }
        } else if (y >= W * 0.84) {
          zoneLabel = "Battery Status";
          compName = "COMPLICATION_TYPE_BATTERY";
          box = { x: cx - 40, y: W * 0.845, w: 80, h: 18 };
        } else {
          return;
        }

        activeHighlight = box;
        shortcutReadoutEl.innerHTML = "<span class='text-[var(--foreground)] font-semibold'>onPress → " + zoneLabel + ":</span> Complications.exitTo(" + compName + ")";
        drawWatch();
        if (highlightTimer) clearTimeout(highlightTimer);
        highlightTimer = setTimeout(function () {
          activeHighlight = null;
          drawWatch();
        }, 1600);
      });

      swatches.forEach(function (btn) {
        btn.addEventListener("click", function () {
          currentThemeIdx = parseInt(btn.getAttribute("data-theme"), 10);
          swatches.forEach(function (s) {
            s.className = "swatch w-4 h-4 rounded-full border border-[var(--card-border)]";
          });
          btn.className = "swatch w-4 h-4 rounded-full border-2 border-[var(--foreground)]";
          drawWatch();
        });
      });

      [
        calendarModeEl, eventTimeEl, eventTitleEl, cardStyleEl, weatherDetailEl, batteryFormatEl,
        blMetricEl, brMetricEl, stepTargetModeEl, readinessModeEl, stepsSliderEl,
        worldCityEl, watchSizeEl, fontWeightEl, ticksToggleEl, arcsToggleEl, sparkToggleEl,
        gaugesToggleEl, actualSizeToggleEl, aodToggleEl
      ].forEach(function (el) {
        el.addEventListener(el.tagName === "INPUT" && el.type !== "checkbox" ? "input" : "change", drawWatch);
      });
      [customPrimEl, customSecEl].forEach(function (picker) {
        if (!picker) return;
        picker.addEventListener("input", function () {
          currentThemeIdx = 7;
          swatches.forEach(function (s) {
            s.className = parseInt(s.getAttribute("data-theme"), 10) === 7
              ? "swatch w-4 h-4 rounded-full border-2 border-[var(--foreground)]"
              : "swatch w-4 h-4 rounded-full border border-[var(--card-border)]";
          });
          drawWatch();
        });
      });
      window.addEventListener("themechange", drawWatch);

      setupDpi();
      drawWatch();
      setInterval(drawWatch, 1000);
    })();
  </script>
</body>

</html>
