<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Forerunner 570 Watch Face Studio</title>
  <script src="https://www.gstatic.com/antigravity/web/dev/tailwindcss.min.js"></script>
</head>
<body class="bg-transparent text-[var(--foreground)] antialiased p-0 m-0">
  <div class="py-1 grid grid-cols-1 md:grid-cols-[296px_1fr] gap-4 items-center">
    <!-- Left: Interactive Clickable AMOLED Watch Canvas -->
    <div class="flex flex-col items-center justify-center">
      <canvas id="watchCanvas" width="288" height="288" class="block rounded-full cursor-pointer" title="Click any data zone to test touch-and-hold shortcut"></canvas>
      <div id="specLine" class="mt-1 text-xs font-mono text-[var(--muted-foreground)] text-center">
        47mm (454x454) • Click watch zones to test shortcuts
      </div>
    </div>

    <!-- Right: Live Controls & Interactive Touch Readout -->
    <div class="space-y-2 text-xs">
      <div class="pb-1.5 border-b border-[var(--card-border)] flex items-center justify-between gap-2">
        <span class="font-semibold text-sm text-[var(--foreground)]">FR570 Runner Pro v1.2 • Bento AMOLED</span>
        <span id="modeBadge" class="px-2 py-0.5 rounded-full bg-[var(--card)] border border-[var(--card-border)] font-mono text-[var(--muted-foreground)]">Active Mode</span>
      </div>

      <!-- Editable Event Preview -->
      <div class="grid grid-cols-3 gap-2">
        <div>
          <label class="block text-[var(--muted-foreground)] mb-0.5">Event Time</label>
          <input id="eventTimeInput" type="text" value="16:30" maxlength="10" class="w-full px-2 py-1 rounded bg-[var(--card)] border border-[var(--card-border)] text-[var(--foreground)] font-mono" />
        </div>
        <div class="col-span-2">
          <label class="block text-[var(--muted-foreground)] mb-0.5">Event Title</label>
          <input id="eventTitleInput" type="text" value="Aiden music" maxlength="48" class="w-full px-2 py-1 rounded bg-[var(--card)] border border-[var(--card-border)] text-[var(--foreground)]" />
        </div>
      </div>

      <!-- Step Target Mode + Readiness Mode -->
      <div class="grid grid-cols-2 gap-2">
        <div>
          <label class="block text-[var(--muted-foreground)] mb-0.5">7-Day Step Target Mode</label>
          <select id="stepTargetMode" class="w-full px-2 py-1 rounded bg-[var(--card)] border border-[var(--card-border)] text-[var(--foreground)]">
            <option value="0">7-Day Running Avg (100%)</option>
            <option value="1">Beat 7-Day Avg (+5%)</option>
            <option value="2">Beat 7-Day Avg (+10%)</option>
            <option value="3">Garmin Fixed (10,000)</option>
          </select>
        </div>
        <div>
          <label class="block text-[var(--muted-foreground)] mb-0.5">Top-Left Training Pod</label>
          <select id="readinessMode" class="w-full px-2 py-1 rounded bg-[var(--card)] border border-[var(--card-border)] text-[var(--foreground)]">
            <option value="0">Readiness Estimate (73)</option>
            <option value="1">Training Status (PROD)</option>
          </select>
        </div>
      </div>

      <!-- Today's Steps Slider + World Clock -->
      <div class="grid grid-cols-2 gap-2">
        <div>
          <div class="flex items-center justify-between text-[var(--muted-foreground)] mb-0.5">
            <span>Today's Steps</span>
            <span id="stepsReadout" class="font-mono text-[var(--foreground)]">5,467</span>
          </div>
          <input id="stepsSlider" type="range" min="0" max="15000" step="100" value="5467" class="w-full mt-1.5 accent-[var(--primary)]" />
        </div>
        <div>
          <label class="block text-[var(--muted-foreground)] mb-0.5">World Clock City</label>
          <select id="worldCity" class="w-full px-2 py-1 rounded bg-[var(--card)] border border-[var(--card-border)] text-[var(--foreground)]">
            <option value="0">Kathmandu (KTM • UTC+5:45)</option>
            <option value="1">New Delhi (DEL • UTC+5:30)</option>
            <option value="2">London / UTC (LON • UTC+0)</option>
            <option value="3">New York (NYC • UTC-5)</option>
            <option value="4">Chicago (CHI • UTC-6)</option>
            <option value="5">Denver (DEN • UTC-7)</option>
            <option value="6">Los Angeles (LAX • UTC-8)</option>
            <option value="7">Paris / Berlin (CET • UTC+1)</option>
            <option value="8">Dubai (DXB • UTC+4)</option>
            <option value="9">Bangkok (BKK • UTC+7)</option>
            <option value="10">Singapore (SIN • UTC+8)</option>
            <option value="11">Tokyo (TYO • UTC+9)</option>
            <option value="12">Sydney (SYD • UTC+10)</option>
            <option value="13">Auckland (AKL • UTC+12)</option>
          </select>
        </div>
      </div>

      <!-- Accent Swatches + Size + AOD -->
      <div class="flex flex-wrap items-center justify-between gap-2 pt-0.5">
        <div class="flex items-center gap-1.5">
          <span class="text-[var(--muted-foreground)] mr-0.5">Accent:</span>
          <button type="button" data-color="#10B981" class="swatch w-4 h-4 rounded-full border-2 border-[var(--foreground)]" style="background:#10B981" title="Emerald Mint"></button>
          <button type="button" data-color="#38BDF8" class="swatch w-4 h-4 rounded-full border border-[var(--card-border)]" style="background:#38BDF8" title="Ice Cyan"></button>
          <button type="button" data-color="#F59E0B" class="swatch w-4 h-4 rounded-full border border-[var(--card-border)]" style="background:#F59E0B" title="Solar Amber"></button>
          <button type="button" data-color="#F43F5E" class="swatch w-4 h-4 rounded-full border border-[var(--card-border)]" style="background:#F43F5E" title="Coral Crimson"></button>
        </div>

        <select id="watchSize" class="px-1.5 py-0.5 rounded bg-[var(--card)] border border-[var(--card-border)] text-[var(--foreground)]">
          <option value="47">47mm</option>
          <option value="42">42mm</option>
        </select>

        <label class="flex items-center gap-1 cursor-pointer select-none text-[var(--foreground)]">
          <input id="aodToggle" type="checkbox" class="accent-[var(--primary)]" />
          <span>AOD Sleep</span>
        </label>
      </div>

      <!-- Interactive Touch Shortcut Feedback -->
      <div id="shortcutReadout" class="px-2.5 py-1.5 rounded bg-[var(--card)] border border-[var(--card-border)] font-mono text-[var(--muted-foreground)]">
        <span class="text-[var(--foreground)] font-semibold">Touch Shortcut:</span> Click any zone on the watch to test WatchFaceDelegate.onPress()
      </div>
    </div>
  </div>

  <script>
    (function () {
      var canvas = document.getElementById("watchCanvas");
      var ctx = canvas.getContext("2d");
      var eventTimeEl = document.getElementById("eventTimeInput");
      var eventTitleEl = document.getElementById("eventTitleInput");
      var stepTargetModeEl = document.getElementById("stepTargetMode");
      var readinessModeEl = document.getElementById("readinessMode");
      var stepsSliderEl = document.getElementById("stepsSlider");
      var stepsReadoutEl = document.getElementById("stepsReadout");
      var worldCityEl = document.getElementById("worldCity");
      var watchSizeEl = document.getElementById("watchSize");
      var aodToggleEl = document.getElementById("aodToggle");
      var specLineEl = document.getElementById("specLine");
      var modeBadgeEl = document.getElementById("modeBadge");
      var shortcutReadoutEl = document.getElementById("shortcutReadout");
      var swatches = document.querySelectorAll(".swatch");

      var SAMPLE_7D_HISTORY = [7600, 8900, 8100, 9600, 7400, 8500, 7740];
      var WORLD_CITIES = [
        { code: "KTM", offsetMins: 345 },
        { code: "DEL", offsetMins: 330 },
        { code: "LON", offsetMins: 0 },
        { code: "NYC", offsetMins: -300 },
        { code: "CHI", offsetMins: -360 },
        { code: "DEN", offsetMins: -420 },
        { code: "LAX", offsetMins: -480 },
        { code: "CET", offsetMins: 60 },
        { code: "DXB", offsetMins: 240 },
        { code: "BKK", offsetMins: 420 },
        { code: "SIN", offsetMins: 480 },
        { code: "TYO", offsetMins: 540 },
        { code: "SYD", offsetMins: 600 },
        { code: "AKL", offsetMins: 720 }
      ];

      var accent = "#10B981";
      var logicalSize = 288;
      var activeHighlight = null;
      var highlightTimer = null;

      function setupDpi() {
        var dpr = window.devicePixelRatio || 1;
        canvas.width = logicalSize * dpr;
        canvas.height = logicalSize * dpr;
        canvas.style.width = logicalSize + "px";
        canvas.style.height = logicalSize + "px";
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      }

      function pad2(n) {
        return n < 10 ? "0" + n : "" + n;
      }

      function formatComma(n) {
        return n.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ",");
      }

      function computeStepTarget(mode) {
        var sum = 0;
        for (var i = 0; i < SAMPLE_7D_HISTORY.length; i++) {
          sum += SAMPLE_7D_HISTORY[i];
        }
        var avg7d = Math.floor(sum / SAMPLE_7D_HISTORY.length);
        if (mode === 1) return Math.floor((avg7d * 105) / 100);
        if (mode === 2) return Math.floor((avg7d * 110) / 100);
        if (mode === 3) return 10000;
        return avg7d;
      }

      function fitText(text, maxWidth) {
        if (ctx.measureText(text).width <= maxWidth) {
          return text;
        }
        var trimmed = text;
        while (trimmed.length > 1 && ctx.measureText(trimmed + "...").width > maxWidth) {
          trimmed = trimmed.slice(0, -1);
        }
        return trimmed + "...";
      }

      function getWorldCityParts(now, cityIndex) {
        var city = WORLD_CITIES[cityIndex] || WORLD_CITIES[0];
        var utcMs = now.getTime() + (now.getTimezoneOffset() * 60000);
        var cityDate = new Date(utcMs + (city.offsetMins * 60000));
        var hh = pad2(cityDate.getHours());
        var mm = pad2(cityDate.getMinutes());

        var localKey = (now.getFullYear() * 10000) + ((now.getMonth() + 1) * 100) + now.getDate();
        var cityKey = (cityDate.getFullYear() * 10000) + ((cityDate.getMonth() + 1) * 100) + cityDate.getDate();
        var dayTag = "";
        if (cityKey > localKey) dayTag = " +1";
        else if (cityKey < localKey) dayTag = " -1";
        return { code: city.code, timeStr: hh + ":" + mm + dayTag };
      }

      function drawArcSeg(cx, cy, r, startDeg, endDeg, ccw, color, width) {
        ctx.beginPath();
        ctx.arc(cx, cy, r, (startDeg * Math.PI) / 180, (endDeg * Math.PI) / 180, ccw);
        ctx.strokeStyle = color;
        ctx.lineWidth = width;
        ctx.lineCap = "round";
        ctx.stroke();
      }

      function drawHBar(x, y, w, h, ratio, color) {
        ctx.fillStyle = "#1E293B";
        ctx.beginPath();
        ctx.roundRect(x, y, w, h, 2);
        ctx.fill();
        var fw = Math.round(w * ratio);
        if (fw > 0) {
          ctx.fillStyle = color;
          ctx.beginPath();
          ctx.roundRect(x, y, Math.max(3, fw), h, 2);
          ctx.fill();
        }
      }

      function drawSegBar(x, y, w, h, activeCnt, cols) {
        var gap = 2;
        var sw = (w - (cols.length - 1) * gap) / cols.length;
        for (var i = 0; i < cols.length; i++) {
          ctx.fillStyle = i < activeCnt ? cols[i] : "#1E293B";
          ctx.beginPath();
          ctx.roundRect(x + i * (sw + gap), y, sw, h, 1);
          ctx.fill();
        }
      }

      function drawWatch() {
        var W = logicalSize;
        var cx = W / 2;
        var cy = W / 2;
        var isAod = aodToggleEl.checked;
        var cityIdx = parseInt(worldCityEl.value, 10);
        var targetMode = parseInt(stepTargetModeEl.value, 10);
        var readyMode = parseInt(readinessModeEl.value, 10);
        var stepsToday = parseInt(stepsSliderEl.value, 10);
        var stepTarget = computeStepTarget(targetMode);
        var evTime = (eventTimeEl.value || "").trim();
        var evTitle = (eventTitleEl.value || "").trim();
        var sizeMm = watchSizeEl.value;

        stepsReadoutEl.textContent = formatComma(stepsToday);
        var pxLabel = sizeMm === "47" ? "454x454" : "390x390";
        specLineEl.textContent = sizeMm + "mm (" + pxLabel + ") • Click watch zones to test shortcuts";
        modeBadgeEl.textContent = isAod ? "AOD (<10% pixels)" : "Active Mode";

        ctx.clearRect(0, 0, W, W);

        // Metallic Bezel & Pure AMOLED Face
        ctx.beginPath();
        ctx.arc(cx, cy, W * 0.495, 0, Math.PI * 2);
        ctx.fillStyle = "#1E293B";
        ctx.fill();

        ctx.beginPath();
        ctx.arc(cx, cy, W * 0.472, 0, Math.PI * 2);
        ctx.fillStyle = "#000000";
        ctx.fill();

        var now = new Date();
        var hh = pad2(now.getHours());
        var mm = pad2(now.getMinutes());
        var ss = pad2(now.getSeconds());
        var worldParts = getWorldCityParts(now, cityIdx);

        if (isAod) {
          var shiftX = (now.getMinutes() % 2 === 0) ? 2 : -2;
          ctx.fillStyle = "#9CA3AF";
          ctx.font = "700 42px system-ui, sans-serif";
          ctx.textAlign = "center";
          ctx.textBaseline = "middle";
          ctx.fillText(hh + ":" + mm, cx + shiftX, cy - 16);

          ctx.fillStyle = "#6B7280";
          ctx.font = "600 10px system-ui, sans-serif";
          ctx.fillText(worldParts.code + " " + worldParts.timeStr, cx + shiftX, cy + 16);

          var aodEvent = evTime ? (evTime + " • " + (evTitle || "Upcoming Event")) : "No upcoming events";
          ctx.fillText(fitText(aodEvent, W * 0.68), cx + shiftX, cy + 32);
          return;
        }

        // 60-Tick Chronograph Chapter Ring
        var outerR = W * 0.468;
        for (var t = 0; t < 60; t++) {
          var isMajor = (t % 5) === 0;
          var innerR = outerR - (isMajor ? 5 : 2.8);
          var rad = (t * 6 * Math.PI) / 180;
          ctx.beginPath();
          ctx.moveTo(cx + innerR * Math.cos(rad), cy - innerR * math.sin(rad));
          ctx.lineTo(cx + outerR * Math.cos(rad), cy - outerR * math.sin(rad));
          ctx.strokeStyle = isMajor ? "#475569" : "#1E293B";
          ctx.lineWidth = isMajor ? 1.4 : 0.8;
          ctx.stroke();
        }

        // Dual Outer Progress Arcs + Glowing Tip Dots
        var stepRatio = Math.max(0, Math.min(1, stepsToday / stepTarget));
        var intRatio = 65 / 150;
        var arcR = W * 0.436;
        drawArcSeg(cx, cy, arcR, 125, 235, false, "#162032", 3.5);
        if (stepRatio > 0.01) {
          var endStepDeg = 125 + (110 * stepRatio);
          drawArcSeg(cx, cy, arcR, 125, endStepDeg, false, accent, 3.5);
          var sRad = (endStepDeg * Math.PI) / 180;
          ctx.fillStyle = "#FFFFFF";
          ctx.beginPath();
          ctx.arc(cx + arcR * Math.cos(sRad), cy + arcR * Math.sin(sRad), 2.8, 0, Math.PI * 2);
          ctx.fill();
        }

        drawArcSeg(cx, cy, arcR, 55, 305, true, "#162032", 3.5);
        var endIntDeg = 55 - (110 * intRatio);
        drawArcSeg(cx, cy, arcR, 55, endIntDeg, true, "#F59E0B", 3.5);
        var iRad = (endIntDeg * Math.PI) / 180;
        ctx.fillStyle = "#FFFFFF";
        ctx.beginPath();
        ctx.arc(cx + arcR * Math.cos(iRad), cy + arcR * Math.sin(iRad), 2.8, 0, Math.PI * 2);
        ctx.fill();

        // Top Weather Header + Vector Weather Icon (Partly Cloudy)
        var months = ["JAN", "FEB", "MAR", "APR", "MAY", "JUN", "JUL", "AUG", "SEP", "OCT", "NOV", "DEC"];
        var line1 = months[now.getMonth()] + " " + now.getDate() + " • 64° FL 62°";
        var line2 = "H73°/L60° • P10% • H45%";
        ctx.font = "600 9.5px system-ui, sans-serif";
        var l1w = ctx.measureText(line1).width;
        var sx1 = cx - ((l1w + 15) / 2);

        // Vector Sun + Cloud Icon
        ctx.fillStyle = "#F59E0B";
        ctx.beginPath();
        ctx.arc(sx1 + 6, W * 0.068 - 2, 3, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = "#E2E8F0";
        ctx.beginPath();
        ctx.arc(sx1 + 3, W * 0.068 + 1, 2.8, 0, Math.PI * 2);
        ctx.arc(sx1 + 6.5, W * 0.068 + 1.5, 2.3, 0, Math.PI * 2);
        ctx.fill();

        ctx.textAlign = "left";
        ctx.textBaseline = "middle";
        ctx.fillStyle = "#FFFFFF";
        ctx.fillText(line1, sx1 + 14, W * 0.068);

        ctx.textAlign = "center";
        ctx.fillStyle = "#94A3B8";
        ctx.font = "600 8.5px system-ui, sans-serif";
        ctx.fillText(line2, cx, W * 0.112);

        // Split Digital Clock + Seconds Pill
        var timeY = W * 0.202;
        ctx.font = "700 32px system-ui, sans-serif";
        var hw = ctx.measureText(hh).width;
        var cw = ctx.measureText(":").width;
        var mw = ctx.measureText(mm).width;
        var tsX = cx - (hw + cw + mw + 22) / 2;

        ctx.textAlign = "left";
        ctx.fillStyle = "#FFFFFF";
        ctx.fillText(hh, tsX, timeY);
        ctx.fillStyle = "#64748B";
        ctx.fillText(":", tsX + hw, timeY - 1);
        ctx.fillStyle = accent;
        ctx.fillText(mm, tsX + hw + cw, timeY);

        var rx = tsX + hw + cw + mw + 5;
        ctx.fillStyle = "#0F172A";
        ctx.beginPath();
        ctx.roundRect(rx, timeY - 4, 17, 12, 3);
        ctx.fill();
        ctx.strokeStyle = "#1E293B";
        ctx.lineWidth = 0.8;
        ctx.stroke();
        ctx.textAlign = "center";
        ctx.font = "700 8px monospace";
        ctx.fillStyle = accent;
        ctx.fillText(ss, rx + 8.5, timeY + 2.5);

        // Two-Tone Kathmandu Capsule
        var pillW = W * 0.38;
        var pillH = 14;
        var pillX = cx - pillW / 2;
        var pillY = W * 0.268;
        var badgeW = 30;

        ctx.fillStyle = "#0F172A";
        ctx.beginPath();
        ctx.roundRect(pillX, pillY, pillW, pillH, 7);
        ctx.fill();
        ctx.fillStyle = "#1E293B";
        ctx.beginPath();
        ctx.roundRect(pillX, pillY, badgeW, pillH, 7);
        ctx.fill();
        ctx.fillRect(pillX + badgeW - 5, pillY, 5, pillH);
        ctx.strokeStyle = "#1E293B";
        ctx.lineWidth = 0.8;
        ctx.beginPath();
        ctx.roundRect(pillX, pillY, pillW, pillH, 7);
        ctx.stroke();

        ctx.font = "700 8px system-ui, sans-serif";
        ctx.fillStyle = "#F59E0B";
        ctx.fillText(worldParts.code, pillX + badgeW / 2, pillY + 7.5);
        ctx.fillStyle = "#7DD3FC";
        ctx.font = "700 8.5px monospace";
        ctx.fillText(worldParts.timeStr, pillX + badgeW + (pillW - badgeW) / 2, pillY + 7.5);

        // Bento Grid Coordinates
        var gridW = W * 0.76;
        var leftX = cx - gridW / 2;
        var gap = 5;

        // Next Calendar Event Bento Card (Left Accent Bar)
        var cardY = W * 0.338;
        var cardH = 28;
        ctx.fillStyle = "#0F172A";
        ctx.beginPath();
        ctx.roundRect(leftX, cardY, gridW, cardH, 6);
        ctx.fill();
        ctx.strokeStyle = "#1E293B";
        ctx.stroke();
        ctx.fillStyle = accent;
        ctx.beginPath();
        ctx.roundRect(leftX + 3, cardY + 4, 3, cardH - 8, 1.5);
        ctx.fill();

        var evH = evTime ? "NEXT" : "CALENDAR";
        var evR = evTime ? evTime : "--:--";
        var evB = evTime ? (evTitle || "Upcoming Event") : "No upcoming events";
        ctx.textAlign = "left";
        ctx.font = "700 7px system-ui, sans-serif";
        ctx.fillStyle = "#94A3B8";
        ctx.fillText(evH, leftX + 10, cardY + 8.5);
        ctx.textAlign = "right";
        ctx.fillStyle = accent;
        ctx.fillText(evR, leftX + gridW - 7, cardY + 8.5);
        ctx.textAlign = "left";
        ctx.font = "600 9.5px system-ui, sans-serif";
        ctx.fillStyle = "#FFFFFF";
        ctx.fillText(fitText(evB, gridW - 18), leftX + 10, cardY + 20);

        // Row 1: Left Readiness+Rec (42%) | Right Steps+7D Sparkline Hero (58%)
        var row1Y = cardY + cardH + gap;
        var row1H = 47;
        var w1 = Math.round((gridW - gap) * 0.42);

        // Card 1: Readiness + Rec
        ctx.fillStyle = "#0F172A";
        ctx.beginPath();
        ctx.roundRect(leftX, row1Y, w1, row1H, 6);
        ctx.fill();
        ctx.strokeStyle = "#1E293B";
        ctx.stroke();

        ctx.font = "700 7px system-ui, sans-serif";
        ctx.fillStyle = "#94A3B8";
        ctx.fillText(readyMode === 0 ? "READY" : "STATUS", leftX + 6, row1Y + 8);
        ctx.textAlign = "right";
        ctx.fillStyle = "#A78BFA";
        ctx.fillText("0h", leftX + w1 - 6, row1Y + 8);
        ctx.textAlign = "left";
        ctx.font = "700 13.5px system-ui, sans-serif";
        ctx.fillStyle = accent;
        ctx.fillText(readyMode === 0 ? "73" : "PROD", leftX + 6, row1Y + 25);
        drawSegBar(leftX + 6, row1Y + row1H - 6.5, w1 - 12, 3, 3, ["#F43F5E", "#F59E0B", "#10B981", "#38BDF8"]);

        // Card 2: Hero Steps + 7D Target + Sparkline
        var x2 = leftX + w1 + gap;
        var w2 = gridW - w1 - gap;
        ctx.fillStyle = "#0F172A";
        ctx.beginPath();
        ctx.roundRect(x2, row1Y, w2, row1H, 6);
        ctx.fill();
        ctx.strokeStyle = "#1E293B";
        ctx.stroke();

        ctx.font = "700 7px system-ui, sans-serif";
        ctx.fillStyle = "#94A3B8";
        ctx.fillText("STEPS", x2 + 6, row1Y + 8);
        ctx.textAlign = "right";
        ctx.fillStyle = "#64748B";
        ctx.fillText((targetMode === 3 ? "G " : "7D ") + formatComma(stepTarget), x2 + w2 - 6, row1Y + 8);
        ctx.textAlign = "left";
        ctx.font = "700 13px system-ui, sans-serif";
        ctx.fillStyle = "#FFFFFF";
        ctx.fillText(formatComma(stepsToday), x2 + 6, row1Y + 25);

        // Mini Sparkline
        var spBaseY = row1Y + row1H - 10;
        var spStartX = x2 + w2 - 34;
        var maxHist = stepTarget;
        for (var k = 0; k < SAMPLE_7D_HISTORY.length; k++) {
          if (SAMPLE_7D_HISTORY[k] > maxHist) maxHist = SAMPLE_7D_HISTORY[k];
        }
        for (var b = 0; b < 7; b++) {
          var val = SAMPLE_7D_HISTORY[b];
          var bh = Math.max(2, Math.round((val / maxHist) * 12));
          ctx.fillStyle = val >= stepTarget ? accent : "#475569";
          ctx.fillRect(spStartX + b * 4, spBaseY - bh, 2.5, bh);
        }
        drawHBar(x2 + 6, row1Y + row1H - 6.5, w2 - 12, 3, stepRatio, accent);

        // Row 2: 3 Mini Bento Pods (Intensity, Heart, Body Battery)
        var row2Y = row1Y + row1H + gap;
        var row2H = 42;
        var podW = (gridW - 2 * gap) / 3;

        // Pod 1: Intensity
        var px1 = leftX;
        ctx.fillStyle = "#0F172A";
        ctx.beginPath();
        ctx.roundRect(px1, row2Y, podW, row2H, 6);
        ctx.fill();
        ctx.strokeStyle = "#1E293B";
        ctx.stroke();
        ctx.textAlign = "center";
        ctx.font = "700 6.8px system-ui, sans-serif";
        ctx.fillStyle = "#94A3B8";
        ctx.fillText("INTENS", px1 + podW / 2, row2Y + 8);
        ctx.font = "700 10px system-ui, sans-serif";
        ctx.fillStyle = "#F59E0B";
        ctx.fillText("65/150", px1 + podW / 2, row2Y + 22.5);
        drawHBar(px1 + 5, row2Y + row2H - 6.5, podW - 10, 3, intRatio, "#F59E0B");

        // Pod 2: Heart Rate + Icon + 5-Zone Strip
        var px2 = leftX + podW + gap;
        ctx.fillStyle = "#0F172A";
        ctx.beginPath();
        ctx.roundRect(px2, row2Y, podW, row2H, 6);
        ctx.fill();
        ctx.strokeStyle = "#1E293B";
        ctx.stroke();
        ctx.font = "700 6.8px system-ui, sans-serif";
        ctx.fillStyle = "#94A3B8";
        ctx.fillText("HEART", px2 + podW / 2, row2Y + 8);
        var hcx = px2 + podW / 2 - 11;
        var hcy = row2Y + 22;
        ctx.fillStyle = "#F43F5E";
        ctx.beginPath();
        ctx.arc(hcx - 1.5, hcy - 1, 2, 0, Math.PI * 2);
        ctx.arc(hcx + 1.5, hcy - 1, 2, 0, Math.PI * 2);
        ctx.moveTo(hcx - 3.3, hcy);
        ctx.lineTo(hcx + 3.3, hcy);
        ctx.lineTo(hcx, hcy + 3.8);
        ctx.fill();
        ctx.font = "700 11.5px system-ui, sans-serif";
        ctx.fillStyle = "#FFFFFF";
        ctx.fillText("82", px2 + podW / 2 + 6, row2Y + 22.5);
        drawSegBar(px2 + 5, row2Y + row2H - 6.5, podW - 10, 3, 2, ["#64748B", "#38BDF8", "#10B981", "#F59E0B", "#F43F5E"]);

        // Pod 3: Body Battery
        var px3 = leftX + 2 * (podW + gap);
        ctx.fillStyle = "#0F172A";
        ctx.beginPath();
        ctx.roundRect(px3, row2Y, podW, row2H, 6);
        ctx.fill();
        ctx.strokeStyle = "#1E293B";
        ctx.stroke();
        ctx.font = "700 6.8px system-ui, sans-serif";
        ctx.fillStyle = "#94A3B8";
        ctx.fillText("BODY BAT", px3 + podW / 2, row2Y + 8);
        ctx.font = "700 11.5px system-ui, sans-serif";
        ctx.fillStyle = "#38BDF8";
        ctx.fillText("78%", px3 + podW / 2, row2Y + 22.5);
        drawHBar(px3 + 5, row2Y + row2H - 6.5, podW - 10, 3, 0.78, "#38BDF8");

        // Bottom 6 O'Clock Segmented Battery Pill
        var battY = W * 0.875;
        var startBattX = cx - 32;
        ctx.strokeStyle = "#94A3B8";
        ctx.lineWidth = 1;
        ctx.strokeRect(startBattX, battY - 4, 16, 8);
        ctx.fillStyle = "#94A3B8";
        ctx.fillRect(startBattX + 16, battY - 2, 1.5, 4);
        for (var blk = 0; blk < 4; blk++) {
          ctx.fillStyle = accent;
          ctx.fillRect(startBattX + 2 + blk * 3.2, battY - 2.5, 2.3, 5);
        }
        ctx.textAlign = "left";
        ctx.font = "600 8.5px system-ui, sans-serif";
        ctx.fillStyle = "#94A3B8";
        ctx.fillText("99% • 6d", startBattX + 22, battY + 0.5);

        if (activeHighlight) {
          ctx.strokeStyle = "#FFFFFF";
          ctx.lineWidth = 1.5;
          ctx.beginPath();
          ctx.roundRect(activeHighlight.x, activeHighlight.y, activeHighlight.w, activeHighlight.h, 6);
          ctx.stroke();
        }
      }

      canvas.addEventListener("click", function (evt) {
        if (aodToggleEl.checked) return;
        var rect = canvas.getBoundingClientRect();
        var x = evt.clientX - rect.left;
        var y = evt.clientY - rect.top;
        var W = logicalSize;
        var cx = W / 2;

        var zoneLabel = "Calendar Event";
        var compName = "COMPLICATION_TYPE_CALENDAR_EVENTS";
        var box = { x: cx - W * 0.38, y: W * 0.338, w: W * 0.76, h: 28 };

        if (y < W * 0.14) {
          zoneLabel = "Weather & Forecast";
          compName = "COMPLICATION_TYPE_CURRENT_WEATHER";
          box = { x: cx - 78, y: W * 0.04, w: 156, h: 28 };
        } else if (y >= W * 0.33 && y < W * 0.46) {
          zoneLabel = "Next Event Card";
          compName = "COMPLICATION_TYPE_CALENDAR_EVENTS";
          box = { x: cx - W * 0.38, y: W * 0.338, w: W * 0.76, h: 28 };
        } else if (y >= W * 0.46 && y < W * 0.66) {
          if (x < W * 0.45) {
            zoneLabel = "Readiness & Recovery";
            compName = "COMPLICATION_TYPE_TRAINING_STATUS";
            box = { x: cx - W * 0.38, y: W * 0.452, w: W * 0.31, h: 47 };
          } else {
            zoneLabel = "Steps & 7D Target";
            compName = "COMPLICATION_TYPE_STEPS";
            box = { x: cx - W * 0.05, y: W * 0.452, w: W * 0.43, h: 47 };
          }
        } else if (y >= W * 0.66 && y < W * 0.84) {
          if (x < W * 0.39) {
            zoneLabel = "Intensity Minutes";
            compName = "COMPLICATION_TYPE_INTENSITY_MINUTES";
            box = { x: cx - W * 0.38, y: W * 0.632, w: W * 0.24, h: 42 };
          } else if (x <= W * 0.61) {
            zoneLabel = "Heart Rate";
            compName = "COMPLICATION_TYPE_HEART_RATE";
            box = { x: cx - W * 0.12, y: W * 0.632, w: W * 0.24, h: 42 };
          } else {
            zoneLabel = "Body Battery";
            compName = "COMPLICATION_TYPE_BODY_BATTERY";
            box = { x: cx + W * 0.14, y: W * 0.632, w: W * 0.24, h: 42 };
          }
        } else if (y >= W * 0.84) {
          zoneLabel = "Battery Status";
          compName = "COMPLICATION_TYPE_BATTERY";
          box = { x: cx - 40, y: W * 0.845, w: 80, h: 18 };
        } else {
          return;
        }

        activeHighlight = box;
        shortcutReadoutEl.innerHTML = "<span class='text-[var(--foreground)] font-semibold'>onPress → " + zoneLabel + ":</span> Complications.exitTo(" + compName + ")";
        drawWatch();
        if (highlightTimer) clearTimeout(highlightTimer);
        highlightTimer = setTimeout(function () {
          activeHighlight = null;
          drawWatch();
        }, 1600);
      });

      swatches.forEach(function (btn) {
        btn.addEventListener("click", function () {
          accent = btn.getAttribute("data-color");
          swatches.forEach(function (s) {
            s.className = "swatch w-4 h-4 rounded-full border border-[var(--card-border)]";
          });
          btn.className = "swatch w-4 h-4 rounded-full border-2 border-[var(--foreground)]";
          drawWatch();
        });
      });

      eventTimeEl.addEventListener("input", drawWatch);
      eventTitleEl.addEventListener("input", drawWatch);
      stepTargetModeEl.addEventListener("change", drawWatch);
      readinessModeEl.addEventListener("change", drawWatch);
      stepsSliderEl.addEventListener("input", drawWatch);
      worldCityEl.addEventListener("change", drawWatch);
      watchSizeEl.addEventListener("change", drawWatch);
      aodToggleEl.addEventListener("change", drawWatch);
      window.addEventListener("themechange", drawWatch);

      setupDpi();
      drawWatch();
      setInterval(drawWatch, 1000);
    })();
  </script>
</body>
</html>
